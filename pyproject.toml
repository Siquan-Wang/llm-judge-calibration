[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judgecal"
version = "0.11.0"
description = "Human-audit reliability experiments and prediction-powered inference for LLM judges"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Siquan Wang" }]
keywords = ["llm", "evaluation", "llm-as-a-judge", "calibration", "confidence-intervals", "measurement-error"]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
]

[project.optional-dependencies]
data = ["datasets>=2.14", "pyarrow>=15"]
dev = ["pytest>=7.0", "pytest-cov"]
report = ["matplotlib>=3.7"]
paper = ["matplotlib>=3.7", "reportlab>=4.4", "pypdf>=5"]
reference = ["ppi-python==0.2.3"]

[project.urls]
Homepage = "https://github.com/Siquan-Wang/llm-judge-calibration"
Issues = "https://github.com/Siquan-Wang/llm-judge-calibration/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
