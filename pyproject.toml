[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judgecal"
version = "0.1.0"
description = "Statistically rigorous calibration and evaluation of LLM-as-a-judge against human labels"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Siquan Wang" }]
keywords = ["llm", "evaluation", "llm-as-a-judge", "calibration", "confidence-intervals", "measurement-error"]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
]

[project.optional-dependencies]
data = ["datasets>=2.14"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/OWNER/llm-judge-calibration"
Issues = "https://github.com/OWNER/llm-judge-calibration/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
