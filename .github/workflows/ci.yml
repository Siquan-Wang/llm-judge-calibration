name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Offline benchmark smoke test
        run: python examples/benchmark_mtbench.py --input reports/mtbench/labels.csv --output "${{ runner.temp }}/judgecal-report"
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Offline research study smoke test
        run: python examples/research_study.py --repetitions 5 --seeds 2 --output "${{ runner.temp }}/judgecal-research"
      - name: Offline factorial study smoke test
        run: python examples/stress_grid.py --repetitions 2 --output "${{ runner.temp }}/judgecal-stress"
      - name: Human-reference sensitivity smoke test
        run: python examples/reference_sensitivity.py --seeds 2 --output "${{ runner.temp }}/judgecal-sensitivity"
      - name: Finite-sample interval study smoke test
        run: python examples/finite_sample_study.py --repetitions 2 --output "${{ runner.temp }}/judgecal-finite-sample"
      - name: Cached-judge accuracy audit smoke test
        run: python examples/llmbar_audit.py --seeds 2 --output "${{ runner.temp }}/judgecal-llmbar"
      - name: Signed coefficient study smoke test
        run: python examples/signed_power_study.py --repetitions 3 --seeds 2 --output "${{ runner.temp }}/judgecal-signed"
      - name: Population versus heldout target study smoke test
        run: python examples/estimand_study.py --repetitions 3 --seeds 2 --output "${{ runner.temp }}/judgecal-estimand"
      - name: RewardBench cross-judge audit smoke test
        run: python examples/rewardbench_audit.py --seeds 2 --output "${{ runner.temp }}/judgecal-rewardbench"
  author-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional pinned author baseline
        run: pip install -e ".[dev,reference]"
      - name: Verify reference source and numerical contracts
        run: pytest -q tests/test_reference_contract.py
      - name: Write author-baseline evidence
        run: python examples/compare_ppi_reference.py --output "${{ runner.temp }}/judgecal-reference"
  research-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install report dependencies
        run: pip install -e ".[dev,paper]"
      - name: Verify PDF text, links and repeatability
        run: pytest -q tests/test_research_report.py
      - name: Verify evidence and build the technical report
        run: python examples/build_research_report.py --output-directory "${{ runner.temp }}/judgecal-synthesis"
