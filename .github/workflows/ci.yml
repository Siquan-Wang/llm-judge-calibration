name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Offline benchmark smoke test
        run: python examples/benchmark_mtbench.py --input reports/mtbench/labels.csv --output "${{ runner.temp }}/judgecal-report"
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
